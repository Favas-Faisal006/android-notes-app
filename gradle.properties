org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Run Kotlin compilation in-process to bypass Kotlin daemon crashes
kotlin.compiler.execution.strategy=in-process

org.gradle.configuration-cache=false
kotlin.code.style=official

android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false

# Escape drive letter colon properly
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

# Keep KSP non-incremental to prevent cache state crashes
ksp.incremental=false